<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Page</title>
</head>
<body>
<!-- 100.5 Перейдём к особенностям фронтенда и для этого нам необходим HTML-файл. И здесь, если мы просто укажем в пути JS-файл, то он вызовет ошибку, пока мы не допишем здесь атрибут type="module", который позволяет браузеру читать модульный JavaScript. -->
<!-- ? 100.6 Тут стоит отметить один момент, что только модульность "ES6" нам позволяет подключать модульный JavaScript без сборщиков проектов (хотя обычно в работе с большими проектами всегда их используют). А вот если мы, например, будем использовать по какой-то причине другую модульную систему (тот же "CommonJS" встречающийся, например, в старых проектах), то без сборщика нам уже не обойтись. При работе с другими модульными системами один лишь атрибут type="module" не поможет. -->
<script src="index.js" type="module"></script>
</body>
</html>
